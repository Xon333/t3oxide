name: t3oxide checks
on:
  push:
    paths:
      - 'adapter/**'
      - 'mac/**'
      - 'scripts/**'
      - 'tests/**'
      - 'cmd/**'
      - 'internal/**'
      - 'config/**'
      - 'go.mod'
      - 'go.sum'
      - 'LICENCE*'
      - 'LICENSE*'
      - 'LICENSES/**'
      - 'NOTICE'
      - '*.md'
      - 'docs/**'
      - '.github/workflows/mac-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3oxide-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    name: Primary Go terminal client
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Terminal client checks
        run: bash scripts/check-go.sh
      - name: Build Apple Silicon terminal client
        run: |
          test "$(uname -m)" = arm64
          bash scripts/build-go.sh
          file dist/t3oxide
          test "$(lipo -archs dist/t3oxide)" = arm64
      - uses: actions/upload-artifact@v4
        with:
          name: t3oxide-terminal-macos-arm64
          path: |
            dist/t3oxide
            NOTICE
            LICENSES/
          if-no-files-found: error
          retention-days: 14
  adapter:
    name: Shared host adapter and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact source for reproducible cloud checks
        run: git archive --format=tar HEAD > /tmp/t3oxide-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: t3oxide-source
          path: /tmp/t3oxide-source.tar
          retention-days: 7
      - name: Adapter and script checks
        run: |
          node --test tests/*.test.mjs
          for file in adapter/*.mjs scripts/*.mjs; do node --check "$file"; done
          bash -n scripts/build-go.sh scripts/check-go.sh scripts/check-portable-core.sh scripts/check.sh
          python3 -m py_compile scripts/measure.py
          python3 -m unittest discover -s tests -p test_measure.py
