[package]
name = "t3oxide"
version = "0.11.0"
edition = "2024"
rust-version = "1.88"
description = "A responsive terminal workspace for existing T3 Code environments"
repository = "https://github.com/Xon333/t3oxide"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
crossbeam-channel = "0.5"
crossterm = "0.29"
libc = "0.2"
nucleo-matcher = "=0.3.1"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
ratatui-textarea = "=0.9.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
tempfile = "3.23"
time = { version = "0.3", features = ["parsing", "formatting"] }
tui-markdown = { version = "=0.3.13", default-features = false }
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "t3oxide"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
