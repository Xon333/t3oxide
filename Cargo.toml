[package]
name = "t3oxide"
version = "0.11.0"
edition = "2024"
rust-version = "1.92"
description = "A responsive terminal workspace for existing T3 Code environments"
repository = "https://github.com/Xon333/t3oxide"
publish = false

[dependencies]
anyhow = "1.0"
ascii-dag = { git = "https://github.com/AshutoshMahala/ascii-dag", rev = "3e0eb3eb36c3871a2b1259d8eac4fcfd4eef34eb", version = "=0.11.0" }
base64 = "0.22"
crossbeam-channel = "0.5"
crossterm = "0.29"
fael-core = { git = "https://github.com/zecalis/fael", rev = "b00e312cc2c313e0595bb0a32214e914439105a8", version = "=0.0.1" }
libc = "0.2"
nucleo-matcher = "=0.3.1"
petgraph = { git = "https://github.com/petgraph/petgraph", rev = "162903562ce5b00cdba390a0d9c1bb80f1c75bf5", version = "=0.8.3" }
pulldown-cmark = "0.13"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
ratatui-textarea = "=0.9.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
slt = { package = "superlighttui", git = "https://github.com/subinium/SuperLightTUI", rev = "d4537d74f4b42188e06cb224fbfe7684397897fb", version = "=0.26.0", features = ["async"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tempfile = "3.23"
termiflow = { git = "https://github.com/dnvt/termiflow", rev = "cdd62fe1717aad26fe53ca1b0ad07454aa4f0e76", version = "=0.2.9" }
time = { version = "0.3", features = ["parsing", "formatting"] }
tui-markdown = { version = "=0.3.13", default-features = false }
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "t3oxide"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
